# Cấu hình test: dùng H2 in-memory, không cần SQL Server
spring.datasource.url=jdbc:h2:mem:ctms_test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
ctms.seed.enabled=true
ctms.seed.password=test-only-password
