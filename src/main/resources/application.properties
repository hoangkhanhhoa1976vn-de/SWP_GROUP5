# ===================================================================
# CTMS - Container Terminal Management System
# Thông tin nhạy cảm KHÔNG ghi trực tiếp vào file này: dùng biến môi trường.
#   DB_URL (tùy chọn), DB_USERNAME, DB_PASSWORD (bắt buộc), CTMS_SEED_PASSWORD
# ===================================================================
spring.application.name=ctms
server.port=8080

# --- Microsoft SQL Server ---
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ctms_db;encrypt=true;trustServerCertificate=true;}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:ctms_app}
spring.datasource.password=${DB_PASSWORD:Ctms@123456}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# --- Dữ liệu mẫu (tài khoản manager/operator/driver/shipping_maersk) ---
ctms.seed.enabled=${CTMS_SEED_ENABLED:true}
ctms.seed.password=${CTMS_SEED_PASSWORD:}

# --- Phí nâng hạ (VND) & thông tin thanh toán VietQR ---
ctms.fee.import-pickup=${CTMS_FEE_IMPORT:450000}
ctms.fee.export-dropoff=${CTMS_FEE_EXPORT:400000}
ctms.payment.bank-code=${CTMS_BANK_CODE:MB}
ctms.payment.account-number=${CTMS_BANK_ACCOUNT:9999888868}
ctms.payment.account-name=${CTMS_BANK_ACCOUNT_NAME:CTMS PORT TERMINAL}

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --- Logging ---
logging.level.com.ctms=INFO
logging.level.org.springframework.security=WARN
